# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests-mysql:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Set up MySQL
              run: |
                  sudo /etc/init.d/mysql start

            - name: Install Dependencies
              run: npm install

            - name: Build
              run: npm run build

            - name: Run MySQL tests
              run: node node_modules/mocha/bin/mocha test/testMySQL*.js --exit
              env:
                  SQL_PASS: root
    #      - name: Run unit tests
    #        run: npm run test:unit
    #      - name: Run integration tests # (linux/osx)
    #        if: startsWith(runner.OS, 'windows') == false
    #        run: DEBUG=testing:* npm run test:integration
    #      - name: Run integration tests # (windows)
    #        if: startsWith(runner.OS, 'windows')
    #        run: set DEBUG=testing:* & npm run test:integration

    adapter-tests-postgres:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            postgres:
                # Docker Hub image
                image: postgres
                # Provide the password for postgres
                env:
                    POSTGRES_PASSWORD: postgres
                # Set health checks to wait until postgres has started
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    # Maps tcp port 5432 on service container to the host
                    - 5432:5432

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              run: npm run build

            - name: Run Postgres tests
              run: node node_modules/mocha/bin/mocha test/testPostgreSQL.js --exit
              env:
                  SQL_PASS: postgres
    #      - name: Run unit tests
    #        run: npm run test:unit
    #      - name: Run integration tests # (linux/osx)
    #        if: startsWith(runner.OS, 'windows') == false
    #        run: DEBUG=testing:* npm run test:integration
    #      - name: Run integration tests # (windows)
    #        if: startsWith(runner.OS, 'windows')
    #        run: set DEBUG=testing:* & npm run test:integration

    adapter-tests-mssql:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            sql.data:
                image: mcr.microsoft.com/mssql/server:2019-latest
                env:
                    SA_PASSWORD: Password12!
                    ACCEPT_EULA: Y
                ports:
                    - '1433:1433'

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              run: npm run build

            - name: Run MSSQL tests
              run: node node_modules/mocha/bin/mocha test/testMSSQL.js --exit
              env:
                  SQL_PASS: Password12!
    #      - name: Run unit tests
    #        run: npm run test:unit
    #      - name: Run integration tests # (linux/osx)
    #        if: startsWith(runner.OS, 'windows') == false
    #        run: DEBUG=testing:* npm run test:integration
    #      - name: Run integration tests # (windows)
    #        if: startsWith(runner.OS, 'windows')
    #        run: set DEBUG=testing:* & npm run test:integration

    adapter-tests-sqlite:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              run: npm run build

            - name: Run SQLite tests
              run: node node_modules/mocha/bin/mocha test/testSQLite.js --exit
            - name: Run Commons
              run: node node_modules/mocha/bin/mocha test/testCommons.js --exit

    #      - name: Run unit tests
    #        run: npm run test:unit
    #      - name: Run integration tests # (linux/osx)
    #        if: startsWith(runner.OS, 'windows') == false
    #        run: DEBUG=testing:* npm run test:integration
    #      - name: Run integration tests # (windows)
    #        if: startsWith(runner.OS, 'windows')
    #        run: set DEBUG=testing:* & npm run test:integration

    # Deploys the final package to NPM
    deploy:
        needs: [adapter-tests-mysql, adapter-tests-postgres, adapter-tests-sqlite, adapter-tests-mssql]

        # Permissions are required to create GitHub releases and npm trusted publishing
        permissions:
            contents: write
            id-token: write

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  node-version: '24.x'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  sentry: true
                  sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  sentry-url: 'https://sentry.iobroker.net'
                  sentry-org: 'iobroker'
                  sentry-project: 'iobroker-sql'
                  sentry-version-prefix: 'iobroker.sql'
