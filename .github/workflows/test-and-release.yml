# This is a composition of lint and test scripts
# Make sure to update this file along with the others

name: Test and Release

# Run this job on all pushes and pull requests
# as well as tags with a semantic version
on:
    push:
        branches:
            - '*'
        tags:
            # normal versions
            - 'v?[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v?[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: true

jobs:
    # Performs quick checks before the expensive test runs
    check-and-lint:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        runs-on: ubuntu-latest
        # `npm run lint` used to walk the committed 8 MB module federation bundle in `admin/custom`
        # and ran for 6 hours until the runner killed it - which blocked every test job below,
        # because they all wait for this one. Fail fast instead of burning a whole runner day.
        timeout-minutes: 15

        steps:
            # `npm run lint` also lints `src-admin`, so its dependencies have to be there
            - uses: ioBroker/testing-action-check@v2
              with:
                  node-version: '24.x'
                  install-command: 'npm run npm'
                  lint: true

    # Runs adapter tests on all supported node versions and OSes
    adapter-tests-mysql:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Set up MySQL
              run: |
                  sudo /etc/init.d/mysql start

            - name: Install Dependencies
              run: npm install

            - name: Build
              # the tests only need the compiled adapter, not the admin component
              run: npm run build:ts

            - name: Run MySQL tests
              run: node node_modules/mocha/bin/mocha test/testMySQL*.js --exit
              env:
                  SQL_PASS: root

    adapter-tests-postgres:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            postgres:
                # Docker Hub image
                image: postgres
                # Provide the password for postgres
                env:
                    POSTGRES_PASSWORD: postgres
                # Set health checks to wait until postgres has started
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    # Maps tcp port 5432 on service container to the host
                    - 5432:5432

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              # the tests only need the compiled adapter, not the admin component
              run: npm run build:ts

            - name: Run Postgres tests
              run: node node_modules/mocha/bin/mocha test/testPostgreSQL.js --exit
              env:
                  SQL_PASS: postgres

    adapter-tests-mssql:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            matrix:
                node-version: [22.x, 24.x]

        # Service containers to run with `container-job`
        services:
            # Label used to access the service container
            sql.data:
                image: mcr.microsoft.com/mssql/server:2019-latest
                env:
                    SA_PASSWORD: Password12!
                    ACCEPT_EULA: Y
                ports:
                    - '1433:1433'

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              # the tests only need the compiled adapter, not the admin component
              run: npm run build:ts

            - name: Run MSSQL tests
              run: node node_modules/mocha/bin/mocha test/testMSSQL.js --exit
              env:
                  SQL_PASS: Password12!

    adapter-tests-sqlite:
        if: contains(github.event.head_commit.message, '[skip ci]') == false

        needs: [check-and-lint]

        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Install Dependencies
              run: npm install

            - name: Build
              # the tests only need the compiled adapter, not the admin component
              run: npm run build:ts

            # These need neither a database nor js-controller, so run them first: they fail in
            # milliseconds instead of after the SQLite integration test.
            - name: Run unit tests
              run: node node_modules/mocha/bin/mocha test/testCommons.js test/testIntegral.js test/testDockerCompose.js test/testErrors.js --exit

            - name: Run SQLite tests
              run: node node_modules/mocha/bin/mocha test/testSQLite.js --exit

    # Deploys the final package to NPM
    deploy:
        needs: [adapter-tests-mysql, adapter-tests-postgres, adapter-tests-sqlite, adapter-tests-mssql]

        # Permissions are required to create GitHub releases and npm trusted publishing
        permissions:
            contents: write
            id-token: write

        # Trigger this step only when a commit on any branch is tagged with a version number
        if: |
            contains(github.event.head_commit.message, '[skip ci]') == false &&
            github.event_name == 'push' &&
            startsWith(github.ref, 'refs/tags/v')

        runs-on: ubuntu-latest

        steps:
            - uses: ioBroker/testing-action-deploy@v1
              with:
                  install-command: 'npm i'
                  node-version: '24.x'
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  sentry: true
                  sentry-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  sentry-url: 'https://sentry.iobroker.net'
                  sentry-org: 'iobroker'
                  sentry-project: 'iobroker-sql'
                  sentry-version-prefix: 'iobroker.sql'
